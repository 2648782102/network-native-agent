name: Bug report
description: Report a reproducible defect in the runtime, CLI, or archived evidence.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, `identity.key` contents, relay credentials, or private habitat data.
        Security issues belong in GitHub Security Advisories, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the observed behavior and the command you ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands, fixture, or test name. Prefer `npm test` output over screenshots.
      placeholder: |
        node --version
        npm test
        node bin/nna.mjs ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or release tag.
    validations:
      required: true
  - type: dropdown
    id: node
    attributes:
      label: Node.js version
      options: ["20.x", "22.x", "24.x", "other"]
    validations:
      required: true
